service: rabbit-mcp

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  profile: rabbiit
  stage: ${opt:stage, 'dev'}
  timeout: 29
  memorySize: 256
  httpApi:
    cors: true
  environment:
    RABBITWORK_API_BASE_URL: ${ssm:/rabbit-mcp/${self:provider.stage}/api-base-url, 'https://app.rabbiit.com/api/v1'}
    RABBITWORK_MCP_DOMAIN: ${ssm:/rabbit-mcp/${self:provider.stage}/mcp-domain, 'mcp.rabbitwork.io'}
    RABBITWORK_OAUTH_SECRET: ${ssm:/rabbit-mcp/${self:provider.stage}/oauth-secret}

custom:
  customDomain:
    domainName: ${ssm:/rabbit-mcp/${self:provider.stage}/mcp-domain, 'mcp.rabbitwork.io'}
    basePath: ''
    certificateName: rabbitwork.io
    stage: ${self:provider.stage}
    createRoute53Record: true
    endpointType: regional
    apiType: http
    securityPolicy: tls_1_2

plugins:
  - serverless-domain-manager

functions:
  mcp:
    handler: server/lambda.handler
    events:
      - httpApi:
          path: /mcp
          method: post
      - httpApi:
          path: /health
          method: get
      - httpApi:
          path: /.well-known/oauth-protected-resource
          method: get
      - httpApi:
          path: /.well-known/oauth-protected-resource/mcp
          method: get
      - httpApi:
          path: /.well-known/oauth-authorization-server
          method: get
      - httpApi:
          path: /authorize
          method: get
      - httpApi:
          path: /authorize
          method: post
      - httpApi:
          path: /token
          method: post

package:
  patterns:
    - 'server/**'
    - '!test/**'
    - '!docs/**'
    - '!.git/**'
    - '!.env'
    - '!.env.*'



