<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>{{title}}</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f1ea;
            color: #1c1915;
            font: 16px/1.45 system-ui, sans-serif;
        }

        main {
            width: min(440px, calc(100% - 32px));
            background: #fff;
            border: 1px solid #e4ddd2;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 12px 40px rgba(40, 30, 10, 0.06);
        }

        h1 {
            font-size: 22px;
            line-height: 1.25;
            margin: 0 0 8px;
        }

        p {
            margin: 0 0 14px;
            color: #4d463d;
        }

        label {
            display: block;
            font-weight: 650;
            margin-bottom: 6px;
        }

        input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            font: inherit;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d9d0c3;
        }

        .error {
            background: #fff1f0;
            color: #8a241c;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
        }

        button {
            margin-top: 16px;
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px 14px;
            background: #1f6b4a;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #5c564e;
        }
    </style>
</head>
<body>
<main>
    <h1>{{title}}</h1>
    {{inner}}
</main>
</body>
</html>
<!-- form -->
{{alert}}
<p><strong>{{clientName}}</strong> will access Rabbitwork with the permissions of the token you paste. Create the token
    in Settings &gt; You &gt; My tokens.</p>
<p>You will then return to <strong>{{host}}</strong>.</p>
{{local}}
<form method="post" action="/authorize" autocomplete="off">
    {{fields}}
    <label for="token">Personal token</label>
    <input id="token" name="token" type="password" maxlength="512" required spellcheck="false" autocomplete="off">
    <button type="submit">Connect</button>
</form>
<p><a class="cancel" href="{{cancel}}">Cancel</a></p>
